name: Moim Backend CI/CD

on:
  push:
    branches: [ "dev" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 최신 코드 가져오기
        uses: actions/checkout@v3

      - name: 2. 도커 허브 로그인
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 3. 백엔드 도커 이미지 빌드 및 허브로 밀어넣기(Push)
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/moim-backend:latest

      - name: 4. GCP 서버 접속 및 새 이미지로 재실행
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST_IP }}
          username: ${{ secrets.HOST_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/Moim/backend
            # 도커 허브에서 방금 포장된 따끈따끈한 새 이미지를 다운로드
            docker-compose -f docker-compose.prod.yml pull backend
            # 서버 멈춤 없이 백엔드만 새 코드로 싹 교체해서 띄우기 (초고속!)
            docker-compose -f docker-compose.prod.yml up -d
            # 안 쓰는 과거의 찌꺼기 이미지들 삭제하여 용량 확보
            docker image prune -f